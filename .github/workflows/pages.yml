# Publishes the documentation site — both halves of it, from one build.
#
#   • The LLM-facing half (llms.txt, llms-full.txt, one page per module) is rendered from the
#     COMMITTED corpus, which `check:corpus` already guarantees matches the library. This
#     workflow never re-derives it and so cannot publish a third opinion.
#   • The human-facing half (`apps/showcase`) is an Angular app whose API tables come from
#     that same corpus and whose demos run against the BUILT library. That is why this
#     workflow now installs and builds: a demo compiled against anything other than what the
#     package publishes would be a demo of something nobody can install.
#
# It deploys only the generated `site/` directory. That is the point of building into a
# dedicated folder rather than serving the repository: `docs/specs/` is internal-only and
# gitignored, and a workflow that published a whole directory tree would be one mistake away
# from putting it on the public web.
#
# ADDRESSES THAT MUST NOT MOVE. The canonical URL is https://angulux.anguless.com/ — a
# subdomain of a domain already owned, which is a HOST ROOT and therefore the address
# assistants probe by convention (https://<host>/llms.txt). `merge-showcase.mjs` hands the
# root `index.html` to the showcase and treats every other collision as a hard error, so
# `llms.txt`, `llms-full.txt` and every `<module>.md` keep the address they were published
# at. The corpus landing page is unchanged and still served at /llms/.
#
# The `CNAME` that puts the site there is emitted into the artifact by build-site, not left
# to the repository setting alone: a workflow deploy replaces the whole published tree, so a
# domain configured only in settings is one deploy away from silently reverting to the
# github.io path while every generated link still names the custom domain.
#
# GitHub 301s the old https://anguless-com.github.io/angulux/* here, so nothing an assistant
# cached goes stale. The PATH does change — the `/angulux/` prefix is dropped — which is why
# that is a redirect and not merely a new hostname in front of unchanged paths.
name: Pages

on:
    push:
        branches: [main]
        # Only when something that can change the output changes. `packages/**` is in the
        # list because the site now RUNS the library: a component whose rendering changes
        # changes every demo of it, and a site that kept showing the previous behaviour
        # would be wrong in the one way this whole feature exists to prevent.
        paths:
            - 'corpus/**'
            - 'tools/corpus/**'
            - 'apps/showcase/**'
            - 'packages/**'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    # Never cancel a half-finished deployment: the live site is the thing being replaced.
    cancel-in-progress: false

env:
    NODE_VERSION: '22'

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            # Full history and tags, because the site states which version it documents and
            # takes that from the git TAG. The root manifest cannot answer it: it says
            # `22.0.0-rc.0`, a version that never existed on npm — see the long comment in
            # `release/angulux.releaserc.json` for why the committed number is not the released
            # one. `build-api.mjs` also counts commits since the tag that touch the published
            # package, so a shallow clone would silently turn "documents 22.2.0 +1 unreleased"
            # into no statement at all.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Enable corepack
              run: corepack enable

            - name: Install
              run: corepack pnpm install --frozen-lockfile

            # Dependency order is real: the library imports from all four. Building them
            # in the wrong order fails in a way that reads like a missing dependency.
            - name: Build the forked packages
              run: |
                  set -euo pipefail
                  for p in utils styled motion styles; do
                      echo "::group::angulux-$p"
                      (cd "packages/angulux-$p" && corepack pnpm run build)
                      echo "::endgroup::"
                  done

            - name: Build the library
              run: corepack pnpm --filter @anguless/angulux run build

            # The showcase's tsconfig points at packages/angulux/dist, so this step is what
            # makes every demo on the site a demo of the published package.
            - name: Build the showcase
              run: corepack pnpm --filter @angulux/showcase run build

            - name: Render the LLM-facing files from the committed corpus
              run: node tools/corpus/build-site.mjs

            - name: Merge the showcase in, refusing to overwrite a published address
              run: node tools/corpus/merge-showcase.mjs

            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
              with:
                  path: site

            - id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
