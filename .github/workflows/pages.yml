# Publishes the LLM-facing documentation: llms.txt, llms-full.txt and one page per warranted
# module. Built from the COMMITTED corpus, which `check:corpus` already guarantees matches the
# library — so this workflow never re-derives anything and cannot publish a third opinion.
#
# It deploys only the generated `site/` directory. That is the point of building into a
# dedicated folder rather than serving the repository: `docs/specs/` is internal-only and
# gitignored, and a workflow that published a whole directory tree would be one mistake away
# from putting it on the public web.
#
# The canonical URL is https://angulux.anguless.com/ — a subdomain of a domain already owned,
# which is a HOST ROOT and therefore the address assistants probe by convention
# (https://<host>/llms.txt). The `CNAME` that puts it there is emitted into the artifact by
# build-site, not left to the repository setting alone: a workflow deploy replaces the whole
# published tree, so a domain configured only in settings is one deploy away from silently
# reverting to the github.io path while every generated link still names the custom domain.
#
# GitHub 301s the old https://anguless-com.github.io/angulux/* here, so nothing an assistant
# cached goes stale. The PATH does change — the `/angulux/` prefix is dropped — which is why
# that is a redirect and not merely a new hostname in front of unchanged paths.
name: Pages

on:
    push:
        branches: [main]
        # Only when something that can change the output changes.
        paths:
            - 'corpus/**'
            - 'tools/corpus/**'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    # Never cancel a half-finished deployment: the live site is the thing being replaced.
    cancel-in-progress: false

env:
    NODE_VERSION: '22'

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Build the site from the committed corpus
              run: node tools/corpus/build-site.mjs

            - uses: actions/configure-pages@v6

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site

            - id: deployment
              uses: actions/deploy-pages@v5
