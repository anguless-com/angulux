# Release: two independent trains, one repository.
#
#   angulux        22.x  — major locked to Angular's major, tag `angulux-v*`
#   the fork family 1.x  — angulux-{styled,utils,styles,motion}, tag `angulux-forks-v*`
#
# The trains are separate because binding the forked primeuix packages to Angular's major
# would state a compatibility constraint that does not exist: they do not depend on Angular.
#
# Each train is gated on paths, and that gate answers exactly one question: does this train
# RUN. It has never filtered commits, and the previous version of this paragraph implied it
# did. Measured on 2026-08-14 during the 22.2.0 release: both trains printed `Analysis of 17
# commits complete` — the same seventeen — so `feat(mcp)` and `feat(site)` bumped both to a
# minor and were published under **Features** in both sets of release notes, despite being in
# no released package at all.
#
# Two mechanisms now, for two different questions:
#
#   • the path gate below decides whether a train runs;
#   • `release/rail-filter.mjs` decides which commits it counts, wrapping commit-analyzer and
#     release-notes-generator so the version and the notes are made of the same subset.
#
# Both read their path lists from `release/rails.mjs`. One definition, because two copies is
# how a gate and a filter come to cover different things.
#
# PUBLISHING: npm Trusted Publishing (OIDC). No NPM_TOKEN. See release/README.md for the
# one-time setup — and for why the FIRST publish of a package cannot use OIDC.

name: Release

on:
    workflow_dispatch:
        inputs:
            dry-run:
                description: 'Compute the release without publishing anything'
                type: boolean
                default: true
            train:
                description: 'Which train to release'
                type: choice
                options: [both, angulux, forks]
                default: both

# Releases are never concurrent. Two runs racing to move the same tags is not a situation
# worth being clever about.
concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

env:
    NODE_VERSION: '22'
    # The npm that performs the publish, pinned like everything else this repository
    # installs (constitution P4, and .npmrc save-exact). It was `npm@latest`, which put an
    # unmeasured variable in the one job that mints a publishing credential: an install
    # script or a regression in a brand-new npm would execute here, and a change to npm's
    # OIDC exchange would fail the publish AFTER semantic-release has already tagged.
    # 12.0.2 is what `latest` resolved to when this was pinned, so the pin changed nothing
    # about what runs — it only stopped it moving without a decision. Trusted Publishing
    # needs >= 11.5.1, which is why the npm bundled with Node is not enough.
    # Nothing watches this number: dependabot parses `uses:` and manifests, never a `run:`
    # line. Move it deliberately, like SR_TOOLING below.
    NPM_VERSION: '12.0.2'
    # Release tooling stays OUT of devDependencies on purpose: this repository's dependency tree
    # IS its license risk surface (see SECURITY.md) and its lockfile is evidence. It is installed
    # into $RUNNER_TEMP instead — outside the repository entirely, so it cannot reach the manifest
    # or the lockfile — and reached through NODE_PATH.
    #
    # It used to run through `npx -p semantic-release -p @semantic-release/...`. That never worked:
    # semantic-release loads plugins with resolve-from(cwd, name), i.e. out of the PROJECT's
    # node_modules, while npx leaves them in its own cache. Every plugin came back
    # MODULE_NOT_FOUND, and because the workflow is dispatch-only it was never run until
    # 2026-07-30. `npm install` inside the repository is not the alternative: this is a pnpm
    # workspace whose manifests use the `catalog:` and `workspace:` protocols, which npm cannot
    # resolve.
    #
    # Pinned exactly, like everything else this repository installs — no ^, no ~.
    #
    # @semantic-release/git and @semantic-release/changelog were removed on 2026-08-01: the git
    # plugin pushes the release commit to `main`, which branch protection rejects, and the
    # changelog plugin only ever existed to produce a file for that commit to carry. See
    # release/README.md — "Why a release does not commit anything".
    SR_TOOLING: >-
        semantic-release@24.2.9
        @semantic-release/commit-analyzer@13.0.1
        @semantic-release/release-notes-generator@14.1.1
        @semantic-release/exec@7.1.0
        @semantic-release/github@12.0.9
        @semantic-release/npm@13.1.5
        conventional-changelog-conventionalcommits@8.0.0

jobs:
    # ---------------------------------------------------------------------------
    # Never release something that is not green. This repeats CI deliberately —
    # a release is exactly the moment not to trust a status check from an older commit.
    # ---------------------------------------------------------------------------
    verify:
        name: Verify
        runs-on: ubuntu-latest
        outputs:
            angulux-changed: ${{ steps.paths.outputs.angulux }}
            forks-changed: ${{ steps.paths.outputs.forks }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Enable corepack
              run: corepack enable

            - name: Install
              run: corepack pnpm install --frozen-lockfile

            - name: Gates (17)
              run: npm run check

            - name: Build the forked packages
              run: |
                  set -euo pipefail
                  for p in utils styled motion styles; do
                      (cd "packages/angulux-$p" && corepack pnpm run build)
                  done

            - name: Build the library
              run: corepack pnpm --filter @anguless/angulux run build

            - name: Unit tests
              run: corepack pnpm --filter @anguless/angulux run test:unit

            - name: Browser gate
              run: |
                  corepack pnpm --filter @angulux/verify run build
                  corepack pnpm exec playwright install --with-deps chromium
                  corepack pnpm exec playwright test --config e2e/playwright.config.ts

            # The last line of defence before an irreversible action.
            #
            # This replaced a guard that globbed `packages/angulux-*/dist/**/package.json`.
            # tsup emits no package.json into dist, so that guard read zero files and passed
            # — while three of the four forked packages were about to publish
            # `"angulux-utils": "workspace:^"` and break every consumer's install with
            # EUNSUPPORTEDPROTOCOL. A check aimed at the wrong path does not report "nothing
            # found"; it reports success.
            #
            # check-publishable packs each package and reads package.json back OUT of the
            # tarball, so it inspects the exact bytes npm would receive.
            - name: The tarballs are safe to publish
              run: npm run check:publishable

            # The same reasoning one step further in: a published version cannot be taken
            # back, and declarations that only fail under `skipLibCheck: false` fail in the
            # consumer's build, never in ours. Every tsconfig here sets skipLibCheck true, so
            # this is the only place our own emitted .d.ts are compiled for real.
            - name: The shipped declarations are safe to publish
              run: npm run check:dts

            - name: Which trains have changes
              id: paths
              run: |
                  set -euo pipefail

                  since() {
                      # Last tag of this train, or the root commit on a first release.
                      git describe --tags --match "$1" --abbrev=0 2>/dev/null \
                          || git rev-list --max-parents=0 HEAD | tail -1
                  }

                  a_base=$(since 'angulux-v*')
                  f_base=$(since 'angulux-forks-v*')

                  # The same path lists rail-filter.mjs uses, read from the same file. Left
                  # unquoted on purpose: each is a list of paths for `git diff -- …`.
                  a_paths=$(node release/rails.mjs angulux)
                  f_paths=$(node release/rails.mjs forks)

                  # shellcheck disable=SC2086
                  a_changed=$(git diff --name-only "$a_base"..HEAD -- $a_paths)
                  # shellcheck disable=SC2086
                  f_changed=$(git diff --name-only "$f_base"..HEAD -- $f_paths)

                  if [ -n "$a_changed" ]; then
                      echo "angulux=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "angulux=false" >> "$GITHUB_OUTPUT"
                  fi

                  if [ -n "$f_changed" ]; then
                      echo "forks=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "forks=false" >> "$GITHUB_OUTPUT"
                  fi

                  {
                      echo "### Trains with changes"
                      echo ""
                      echo "| train | base | changed |"
                      echo "|---|---|---|"
                      echo "| angulux | \`$a_base\` | $( [ -n "$a_changed" ] && echo yes || echo no ) |"
                      echo "| forks | \`$f_base\` | $( [ -n "$f_changed" ] && echo yes || echo no ) |"
                  } >> "$GITHUB_STEP_SUMMARY"

    # ---------------------------------------------------------------------------
    # The fork family goes first: `angulux` depends on all four, so a release that
    # bumped both trains must have the dependency published before the dependent.
    # ---------------------------------------------------------------------------
    forks:
        name: Release the fork family (1.x)
        runs-on: ubuntu-latest
        needs: verify
        if: |
            needs.verify.outputs.forks-changed == 'true' &&
            (github.event.inputs.train == 'both' || github.event.inputs.train == 'forks')
        permissions:
            contents: write
            issues: write
            pull-requests: write
            # Required for npm Trusted Publishing (OIDC) and for provenance attestations.
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Deliberately no `registry-url:`. It makes setup-node write an .npmrc containing
            # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and this workflow has no
            # NODE_AUTH_TOKEN on purpose — publishing authenticates through OIDC.
            #
            # npm does not read an unset variable as "no credential". It sends the unexpanded
            # string as the token, the registry rejects it, and the rejection surfaces as
            #
            #     npm error 404 Not Found - PUT https://registry.npmjs.org/@anguless%2f…
            #     npm error 404 … could not be found or you do not have permission to access it
            #
            # which reads like a missing package rather than a failed login. That is what the
            # release of 2026-08-01 (run 30686755583) died on, after tagging.
            #
            # Without the file, npm falls back to the default registry with no credential
            # configured, which is the state its OIDC exchange expects.
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Enable corepack
              run: corepack enable

            # Pinned in the workflow env block above — see the reasoning there.
            - name: Update npm
              run: npm install -g "npm@$NPM_VERSION"

            - name: Install
              run: corepack pnpm install --frozen-lockfile

            - name: Build
              run: |
                  set -euo pipefail
                  for p in utils styled motion styles; do
                      (cd "packages/angulux-$p" && corepack pnpm run build)
                  done

            # Computes the version, stamps it into all four package.json files (via
            # release/set-fork-versions.mjs), tags, and creates the GitHub release. It does
            # NOT commit — see release/README.md, "Why a release does not commit anything" —
            # and it does NOT publish; the publish step below runs under OIDC.
            - name: Version before
              id: before
              run: echo "version=$(node -p "require('./packages/angulux-styled/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Install the release tooling, outside the repository
              run: bash release/install-tooling.sh

            - name: semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  semantic-release --extends ./release/forks.releaserc.json \
                      ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}

            - name: Did a release happen
              id: after
              if: github.event.inputs.dry-run != 'true'
              run: |
                  set -euo pipefail
                  version=$(node -p "require('./packages/angulux-styled/package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if [ "$version" = "${{ steps.before.outputs.version }}" ]; then
                      echo "released=false" >> "$GITHUB_OUTPUT"
                      echo "No release warranted by the commits since the last tag. Nothing to publish."
                  else
                      echo "released=true" >> "$GITHUB_OUTPUT"
                      echo "Released ${{ steps.before.outputs.version }} → $version"
                  fi

            # All four move together on one version. A mismatch means set-fork-versions.mjs
            # did not stamp every package — publishing a partial set would leave `angulux`
            # depending on a version of a sibling that does not exist.
            - name: All four packages carry the released version
              if: steps.after.outputs.released == 'true'
              run: |
                  set -euo pipefail
                  expected="${{ steps.after.outputs.version }}"
                  bad=0
                  for p in styled utils styles motion; do
                      actual=$(node -p "require('./packages/angulux-$p/package.json').version")
                      if [ "$actual" != "$expected" ]; then
                          echo "::error::angulux-$p is at $actual, expected $expected"
                          bad=1
                      fi
                  done
                  [ "$bad" -eq 0 ] || exit 1
                  echo "all four at $expected"

            # The failure this guards against is silent by construction: a credential npm
            # cannot resolve is not refused locally, it is sent, and the registry answers 404 —
            # indistinguishable from a package that does not exist. Assert the state OIDC needs
            # rather than discovering it from a misleading error after the tag has moved.
            - name: No npm credential is configured
              if: steps.after.outputs.released == 'true'
              run: |
                  set -euo pipefail
                  token=$(npm config get "//registry.npmjs.org/:_authToken" 2>/dev/null || true)
                  case "$token" in
                      '' | undefined | null)
                          echo "no registry credential configured — OIDC supplies one at publish time"
                          ;;
                      *)
                          echo "::error::an npm registry credential is configured; this workflow publishes"
                          echo "through OIDC and must have none. If it came from setup-node's"
                          echo "registry-url input, remove it — an unset NODE_AUTH_TOKEN is sent"
                          echo "verbatim and the registry rejects it as a 404."
                          exit 1
                          ;;
                  esac

            - name: Publish to npm
              if: steps.after.outputs.released == 'true'
              run: |
                  set -euo pipefail
                  version="${{ steps.after.outputs.version }}"
                  staging=$(mktemp -d)

                  for p in styled utils styles motion; do
                      dir="packages/angulux-$p"
                      name=$(node -p "require('./$dir/package.json').name")

                      # Already on the registry at a version this run just minted means the
                      # computed version is wrong, or an earlier run published without tagging.
                      # Skipping past it would hide that; publishing over it is impossible.
                      if npm view "$name@$version" version >/dev/null 2>&1; then
                          echo "::error::$name@$version is already on the registry, but this run just released it."
                          echo "Investigate the tags before doing anything else."
                          exit 1
                      fi

                      # Packed with pnpm, published with npm, and deliberately so.
                      #
                      # `pnpm pack` resolves the workspace: protocol into a real range;
                      # `npm publish <directory>` does not, which is how three of these
                      # packages nearly shipped an uninstallable dependency. npm still does
                      # the publishing, because that is what carries OIDC and --provenance.
                      # Publishing the tarball also means the artifact that ships is the same
                      # one check:publishable inspected, rather than a second build of it.
                      echo "::group::publish $name@$version"

                      # The tarball path comes from pnpm's own output, not from the package
                      # name. npm flattens the scope when naming a tarball, so
                      # `@anguless/angulux-utils` packs to `anguless-angulux-utils-<v>.tgz`.
                      # Building the path out of "$name" verbatim produced a path with a
                      # slash in the middle, which never exists — and only at release time,
                      # since this workflow has never run a real publish.
                      # tools/check-publishable.mjs reads the path this way already.
                      tarball=$(cd "$dir" && corepack pnpm pack --pack-destination "$staging" | tail -n 1)
                      [ -f "$tarball" ] || { echo "::error::expected a tarball, got '$tarball'"; ls -la "$staging"; exit 1; }

                      node -e "
                        const {execFileSync}=require('child_process');
                        const p=JSON.parse(execFileSync('tar',['xzOf','$tarball','package/package.json'],{encoding:'utf8'}));
                        for (const f of ['dependencies','peerDependencies','optionalDependencies'])
                          for (const [d,r] of Object.entries(p[f]||{}))
                            if (/^(workspace|catalog):/.test(r)) {
                              console.error('unresolved '+f+'.'+d+' = '+r); process.exit(1);
                            }
                      "

                      npm publish --provenance --access public "$tarball"
                      echo "::endgroup::"
                  done

    angulux:
        name: Release angulux (22.x)
        runs-on: ubuntu-latest
        needs: [verify, forks]
        # `always()` so this still runs when the fork train was skipped (no fork changes)
        # — but not when it actually failed.
        if: |
            always() &&
            needs.verify.result == 'success' &&
            needs.forks.result != 'failure' &&
            needs.forks.result != 'cancelled' &&
            needs.verify.outputs.angulux-changed == 'true' &&
            (github.event.inputs.train == 'both' || github.event.inputs.train == 'angulux')
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  # `main` is unchanged by a release — nothing commits any more — but the tag
                  # the fork train just pushed is fetched here, and the next step reads it.
                  ref: main

            # Deliberately no `registry-url:`. It makes setup-node write an .npmrc containing
            # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and this workflow has no
            # NODE_AUTH_TOKEN on purpose — publishing authenticates through OIDC.
            #
            # npm does not read an unset variable as "no credential". It sends the unexpanded
            # string as the token, the registry rejects it, and the rejection surfaces as
            #
            #     npm error 404 Not Found - PUT https://registry.npmjs.org/@anguless%2f…
            #     npm error 404 … could not be found or you do not have permission to access it
            #
            # which reads like a missing package rather than a failed login. That is what the
            # release of 2026-08-01 (run 30686755583) died on, after tagging.
            #
            # Without the file, npm falls back to the default registry with no credential
            # configured, which is the state its OIDC exchange expects.
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Enable corepack
              run: corepack enable

            - name: Update npm
              run: npm install -g "npm@$NPM_VERSION"

            - name: Install
              run: corepack pnpm install --frozen-lockfile

            # `angulux` depends on the four forks through `workspace:^`, and postbuild resolves
            # that by reading each fork's package.json off disk (tools/build/postbuild.mjs).
            #
            # Those files used to be correct here because @semantic-release/git committed the
            # fork bump to `main` and this job checked `main` out. Nothing commits any more, so
            # on disk they sit at whatever was last committed by hand — 1.0.0, permanently.
            # Without this step `angulux@22.1.0` would ship declaring `^1.0.0` while the fork it
            # was released beside is 1.1.0: installable, because ^1.0.0 admits 1.1.0, but a
            # floor that has nothing to do with what was tested together.
            #
            # The tag is the record the fork train leaves, and it is correct whether that train
            # just ran, was skipped for lack of changes, or ran in an earlier release.
            - name: Stamp the fork versions from their release tag
              run: |
                  set -euo pipefail
                  tag=$(git tag --list 'angulux-forks-v*' --sort=-v:refname | head -n 1)
                  if [ -z "$tag" ]; then
                      echo "::error::no angulux-forks-v* tag exists, so the fork version the"
                      echo "workspace: ranges should resolve to cannot be established. Seed the"
                      echo "tags before releasing — see release/README.md."
                      exit 1
                  fi
                  echo "resolving workspace: ranges against $tag"
                  node release/set-fork-versions.mjs "${tag#angulux-forks-v}"

            - name: Build
              run: |
                  set -euo pipefail
                  for p in utils styled motion styles; do
                      (cd "packages/angulux-$p" && corepack pnpm run build)
                  done
                  corepack pnpm --filter @anguless/angulux run build

            # Recorded BEFORE semantic-release so the next step can tell "no release was
            # warranted" apart from "a release happened". Those two need opposite handling
            # and are indistinguishable from semantic-release's exit code alone.
            - name: Version before
              id: before
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Install the release tooling, outside the repository
              run: bash release/install-tooling.sh

            - name: semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  semantic-release --extends ./release/angulux.releaserc.json \
                      ${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}

            - name: Did a release happen
              id: after
              if: github.event.inputs.dry-run != 'true'
              run: |
                  set -euo pipefail
                  version=$(node -p "require('./package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if [ "$version" = "${{ steps.before.outputs.version }}" ]; then
                      echo "released=false" >> "$GITHUB_OUTPUT"
                      echo "No release warranted by the commits since the last tag. Nothing to publish."
                  else
                      echo "released=true" >> "$GITHUB_OUTPUT"
                      echo "Released ${{ steps.before.outputs.version }} → $version"
                  fi

            # The version lives in the ROOT package.json; the build propagates it into
            # packages/angulux/package.json and then into dist. Rebuilding here is what makes
            # the artifact carry the released version.
            - name: Rebuild at the released version
              if: steps.after.outputs.released == 'true'
              run: corepack pnpm --filter @anguless/angulux run build

            # The gate that would have caught the bug this whole arrangement exists to avoid.
            #
            # updatePackageJson() in tools/build/build-helper.mjs assigns the ROOT version onto
            # the package manifest on every build. When semantic-release wrote to the package
            # manifest instead of the root, the rebuild silently reverted the bump, dist kept
            # the previous version, `npm view` found it already published, and the job exited 0
            # — a tagged release with nothing on the registry, and a green pipeline.
            #
            # Publishing is irreversible, so this asserts rather than warns.
            - name: The artifact carries the released version
              if: steps.after.outputs.released == 'true'
              run: |
                  set -euo pipefail
                  expected="${{ steps.after.outputs.version }}"
                  actual=$(node -p "require('./packages/angulux/dist/package.json').version")

                  if [ "$actual" != "$expected" ]; then
                      echo "::error::dist/package.json says $actual but $expected was released."
                      echo "The build overwrote the version. Check updatePackageJson() in"
                      echo "tools/build/build-helper.mjs and which package.json semantic-release targets."
                      exit 1
                  fi
                  echo "dist carries $actual, as released"

            # See the fork job for why this exists — a credential npm cannot resolve is sent
            # rather than refused, and the registry answers 404.
            - name: No npm credential is configured
              if: steps.after.outputs.released == 'true'
              run: |
                  set -euo pipefail
                  token=$(npm config get "//registry.npmjs.org/:_authToken" 2>/dev/null || true)
                  case "$token" in
                      '' | undefined | null)
                          echo "no registry credential configured — OIDC supplies one at publish time"
                          ;;
                      *)
                          echo "::error::an npm registry credential is configured; this workflow publishes"
                          echo "through OIDC and must have none. If it came from setup-node's"
                          echo "registry-url input, remove it — an unset NODE_AUTH_TOKEN is sent"
                          echo "verbatim and the registry rejects it as a 404."
                          exit 1
                          ;;
                  esac

            - name: Publish to npm
              if: steps.after.outputs.released == 'true'
              run: |
                  set -euo pipefail
                  version="${{ steps.after.outputs.version }}"
                  name=$(node -p "require('./packages/angulux/dist/package.json').name")

                  # A version that already exists on the registry after semantic-release just
                  # minted it is not a no-op to skip past — it means the computed version was
                  # wrong, or a previous run published and failed to tag. Either way, stop.
                  #
                  # The name is read from the manifest rather than hard-coded. This line asked
                  # about `angulux` long after the package became `@anguless/angulux`, and an
                  # unpublished name makes `npm view` fail — so the guard fell through every
                  # time. The last check standing between a re-run and a duplicate publish was
                  # reporting success without having looked at anything.
                  if npm view "$name@$version" version >/dev/null 2>&1; then
                      echo "::error::$name@$version is already on the registry, but this run just released it."
                      echo "Do not re-publish over it. Investigate the tags before doing anything else."
                      exit 1
                  fi

                  # Packed first, then published, so the artifact that ships is the same one
                  # check:publishable inspected — not a second build of it. See the fork job
                  # for why packing with pnpm rather than npm is load-bearing.
                  staging=$(mktemp -d)
                  tarball=$(cd packages/angulux/dist && corepack pnpm pack --pack-destination "$staging" | tail -n 1)
                  [ -f "$tarball" ] || { echo "::error::expected a tarball, got '$tarball'"; ls -la "$staging"; exit 1; }

                  npm publish --provenance --access public "$tarball"
