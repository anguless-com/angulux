# Dependabot configuration.
#
# The important part of this file is what it REFUSES to update.
#
# PrimeTek moved their packages to a commercial license after a specific version of each.
# Every release at or below the boundary recorded in PROVENANCE.md is MIT, permanently.
# Every release above it is not. An automated bump across that boundary would open a
# licensing incident on this project's behalf, filed by a bot, with a green diff — which
# is exactly the sort of quiet failure the gates in tools/ exist to prevent.
#
# `check:license` would fail such a pull request. This file stops it being opened at all,
# so nobody spends a morning deciding whether to merge something that can never be merged.

version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      versioning-strategy: increase
      labels:
          - dependencies
      commit-message:
          prefix: chore
          include: scope

      # One pull request per ecosystem, not one per dependency.
      #
      # Bumps are never merged here — they are applied to the private tree as coherent
      # commits and synced outward — so these pull requests are notifications, not work.
      # Ungrouped, a routine week opened six of them, and every one closed itself two
      # minutes after the sync landed: six threads of mail to report that nothing had
      # happened. Grouping collapses that into one notification without changing which
      # versions get proposed. No update-types filter here: the ignore rules below
      # already refuse what must not be automated, and a filter would only split the
      # group back apart.
      groups:
          npm:
              patterns:
                  - '*'

      ignore:
          # --- The MIT boundary. Never automate a crossing. -------------------
          - dependency-name: '@primeuix/*'
          - dependency-name: 'primeicons'
          - dependency-name: 'tailwindcss-primeui'

          # --- Everything a catalog owns. Bumped by hand, never by bot. -------
          #
          # pnpm-workspace.yaml is the single source of truth for these versions, and
          # package.json refers to them as `catalog:` or `catalog:angular22` rather than
          # by number. Dependabot does not model catalogs. When it bumped zone.js 0.15.1
          # to 0.16.2 (#87) it updated pnpm-workspace.yaml and the lockfile's `catalogs`
          # block correctly, then flattened the ROOT importer's specifier from
          # `catalog:angular22` to the literal `0.16.2`. package.json still read
          # `catalog:angular22`, so `pnpm install --frozen-lockfile` rejected the lockfile
          # and all 12 gates died before one of them ran. The bump was fine; the catalog
          # link was not.
          #
          # That break is structural, not a one-off. It repeats for any catalog entry the
          # bot touches at any severity, so narrowing by update-type does not avoid it:
          # 0.15.1 to 0.16.2 was not a major. The catalog moves as one reviewed commit
          # in the private tree and syncs outward instead; 866e86c did exactly that for
          # the whole angular22 catalog. These entries protect that mechanism.
          #
          # The cost is real and deliberate: no bot now watches Angular, TypeScript or
          # rxjs for us, including for security advisories. Whoever bumps the catalog owns
          # that. GOVERNANCE.md already made the Angular major a release-line decision;
          # this extends the same hand-driven treatment to the rest of the catalog.
          - dependency-name: '@angular/*'
          - dependency-name: '@angular-devkit/*'
          - dependency-name: 'ng-packagr'
          - dependency-name: 'zone.js'
          - dependency-name: 'rxjs'
          - dependency-name: 'tslib'
          - dependency-name: 'chart.js'
          # typescript MUST stay on 6.0.x: @angular/compiler-cli@22 requires ">=6.0 <6.1"
          # while typescript@latest is already 7.x. check-catalog enforces the floor; this
          # keeps the proposal from being opened in the first place.
          - dependency-name: 'typescript'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      labels:
          - dependencies
          - ci
      commit-message:
          prefix: ci

      # Same reasoning as the npm group above. A group cannot span ecosystems, so an
      # action bump and a package bump in the same week still arrive as two pull
      # requests — two being the floor here, not a shortfall.
      groups:
          actions:
              patterns:
                  - '*'
