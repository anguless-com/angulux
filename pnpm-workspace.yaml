packages:
    - 'packages/*'
    - 'apps/*'

# ---------------------------------------------------------------------------
# Default catalog — external packages that actually get installed into node_modules.
# Pinned EXACTLY: no ^, no ~. This is the license risk surface — every version above the
# boundaries recorded here carries the commercial PrimeUI license (see PROVENANCE.md).
# The first-party angulux-* packages are deliberately absent: they are workspace members,
# referenced through the workspace: protocol, not resolved from a registry.
# ---------------------------------------------------------------------------
catalog:
    '@primeuix/themes': 2.0.3
    'primeicons': 7.0.0
    'tailwindcss-primeui': 0.6.1
    # Chrome of the private showcase app only — the shell, the nav, the code blocks, the API
    # tables. It is deliberately NOT reachable from a demo: demo source is displayed verbatim
    # and copied by readers, so a utility class inside one would make the copied code depend
    # on a build step the reader may not have. `check:demo-code` already draws that boundary
    # for other reasons; this dependency stays on the chrome side of it.
    'tailwindcss': 4.3.3
    '@tailwindcss/postcss': 4.3.3
    # Syntax highlighting, run at BUILD time by the showcase's generate step. It never
    # reaches a browser: the demo payloads ship as colour tokens, so no grammar, no theme and
    # no highlighter is in the bundle. Also a devDependency of the private app only.
    'shiki': 4.4.3
    'chart.js': 4.5.1
    # Used only by the private, unpublished angulux-mcp package. Pinned here rather than as a
    # literal in that package's manifest so check-catalog can see it: a version nothing gates
    # is a version that drifts.
    '@modelcontextprotocol/sdk': 1.30.0
    # Benchmark harness only (devDependency of angulux-mcp, which is private and unpublished).
    '@anthropic-ai/sdk': 0.120.0

# ---------------------------------------------------------------------------
# angular22 catalog — two groups, two opposite rules:
#
#   • Peer-bound (@angular/*): these values flow straight into the published package's
#     peerDependencies. They MUST be ranges — pinning 22.1.1 would break every consumer
#     who moves to Angular 22.2. peerDependencies are never installed, so they are not
#     part of the license risk surface the exact-pinning rule targets.
#
#   • Dev-only (typescript, ng-packagr, build tooling): pinned EXACTLY, so the build is
#     reproducible.
#
# typescript MUST stay on 6.0.x — @angular/compiler-cli@22 requires ">=6.0 <6.1", while
#   typescript@latest is already 7.x. Moving to 7 breaks the build.
# No @angular/cdk — this peer was dropped on purpose. Nothing in the warranted closure
#   needs it; only listbox/orderlist/picklist did, and all three are out of scope.
# ---------------------------------------------------------------------------
catalogs:
    angular22:
        '@angular/animations': ^22.0.0
        '@angular/common': ^22.0.0
        '@angular/compiler': ^22.0.0
        '@angular/core': ^22.0.0
        '@angular/forms': ^22.0.0
        '@angular/platform-browser': ^22.0.0
        '@angular/router': ^22.0.0
        '@angular/compiler-cli': 22.1.1
        '@angular/cli': 22.1.3
        '@angular/build': 22.1.3
        # Prerendering only, and only for the private showcase app. Pinned EXACTLY like the
        # rest of the build tooling — and it has a coupling the others do not: platform-server
        # peers on an EXACT @angular/core version, while '@angular/core' above is deliberately a
        # range. Bump this in lockstep with whatever core resolves to, or pnpm reports an unmet
        # peer. It is NOT peer-bound itself: nothing published depends on it.
        '@angular/platform-server': 22.1.1
        # Required by @angular/build even for a purely STATIC prerender: the builder injects
        # `import { ɵsetAngularAppManifest } from '@angular/ssr'` into the server entry it
        # generates, so there is no prerendering without it. Its peers ARE ranges, unlike
        # platform-server's.
        '@angular/ssr': 22.1.5
        # Only the showcase's prerender entry needs it, to read the generated payloads off disk.
        '@types/node': 26.3.0
        'ng-packagr': 22.1.1
        'typescript': 6.0.3
        'rxjs': 7.8.2
        'zone.js': 0.16.2
        'tslib': 2.8.1
